name: Deploy MLflow to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/mlflow-server-arghya:latest
          docker build -t $IMAGE_URI -f build/Dockerfile build/
          docker push $IMAGE_URI
          docker images

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin 677276107097.dkr.ecr.us-east-1.amazonaws.com
            docker pull 677276107097.dkr.ecr.us-east-1.amazonaws.com/mlflow-server-arghya:latest
            docker stop mlflow || true
            docker rm mlflow || true
            docker run -d --name mlflow -p 5000:5000 \
              -e AWS_DEFAULT_REGION=us-east-1 \
              677276107097.dkr.ecr.us-east-1.amazonaws.com/mlflow-server-arghya:latest
